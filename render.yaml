services:
  - type: web
    name: taste-of-the-world-checkin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: REQUIRE_AUTH
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
